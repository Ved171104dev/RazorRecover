services:
  - type: web
    name: razorrecover-api-ved171104dev
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/Ved171104dev/RazorRecover
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: razorrecover-postgres-ved171104dev
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: razorrecover-redis-ved171104dev
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CONNECTION_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: EMBEDDED_WORKER_ENABLED
        value: "true"
      - key: EMBEDDED_WORKER_INTERVAL_SECONDS
        value: "2"
      - key: API_ORIGIN
        value: https://razorrecover-web-ved171104dev.onrender.com
      - key: PUBLIC_API_URL
        value: https://razorrecover-api-ved171104dev.onrender.com
  - type: web
    name: razorrecover-web-ved171104dev
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Ved171104dev/RazorRecover
    branch: main
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: API_PROXY_URL
        value: https://razorrecover-api-ved171104dev.onrender.com

  - type: keyvalue
    name: razorrecover-redis-ved171104dev
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: razorrecover-postgres-ved171104dev
    plan: free
    region: singapore
    databaseName: razorrecover
    user: razorrecover
    postgresMajorVersion: "17"
