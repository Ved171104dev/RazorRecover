services:
  - type: web
    name: razorrecover-api-ved171104dev
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: razorrecover-postgres-ved171104dev
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: razorrecover-redis-ved171104dev
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CONNECTION_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: API_ORIGIN
        value: https://razorrecover-web-ved171104dev.onrender.com
      - key: PUBLIC_API_URL
        value: https://razorrecover-api-ved171104dev.onrender.com
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: razorrecover-web-ved171104dev
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: API_PROXY_HOSTPORT
        fromService:
          name: razorrecover-api-ved171104dev
          type: web
          property: hostport

  - type: worker
    name: razorrecover-worker-ved171104dev
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.runner
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: razorrecover-postgres-ved171104dev
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: razorrecover-redis-ved171104dev
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: razorrecover-redis-ved171104dev
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: razorrecover-postgres-ved171104dev
    plan: free
    region: singapore
    databaseName: razorrecover
    user: razorrecover
    postgresMajorVersion: "17"
